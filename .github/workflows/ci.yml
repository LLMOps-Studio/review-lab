name: Review Lab CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  LLMOPS_COMMON_REPO: LLMOps-Studio/llmops-common

jobs:
  test-agents:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # --- Cross-repo dependency ---
    # review_lab's pyproject.toml declares llmops-common as a bare
    # dependency (no path/git spec), so CI has to check it out and install
    # it separately first, same as every other lab's CI.
    - name: Checkout llmops-common (shared SDK)
      uses: actions/checkout@v3
      with:
        repository: ${{ env.LLMOPS_COMMON_REPO }}
        path: llmops-common-src

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install llmops-common (editable)
      run: pip install -e ./llmops-common-src

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install in editable mode just like our local environment
        pip install -e .[dev]

    - name: Run Smoke Tests (Mocked LLM)
      run: |
        pytest tests/ -v